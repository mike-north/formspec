name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # OIDC trusted publishing currently depends on pnpm 10.x behavior:
      # `pnpm publish` (via `changeset publish`) delegates to the Node-bundled
      # npm CLI (>= 11.5.1 on Node 24), which performs the OIDC token
      # exchange. pnpm v11 publishes natively and has open OIDC regressions
      # (pnpm/pnpm#11513) — verify trusted publishing still works before
      # bumping the root packageManager field to pnpm 11+.
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      # `registry-url` is deliberately omitted. It makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into ~/.npmrc,
      # which expands to an *empty* token under OIDC (no NODE_AUTH_TOKEN is
      # set). npm then treats auth as already configured, skips the OIDC
      # exchange, and every publish fails with E404 (npm/documentation#1960).
      # registry.npmjs.org is npm's default registry and `access: public`
      # comes from .changeset/config.json, so nothing depends on this input.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify release toolchain
        run: |
          node --version && npm --version && pnpm --version
          # npm >= 11.5.1 is required for OIDC trusted publishing. Fail loudly
          # rather than silently falling back to an unauthenticated publish.
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is too old; trusted publishing needs >= 11.5.1`);
              process.exit(1);
            }' "$(npm --version)"
          # Regression guard for npm/documentation#1960: any _authToken entry
          # here suppresses the OIDC exchange.
          if [ -f "$HOME/.npmrc" ] && grep -q '_authToken' "$HOME/.npmrc"; then
            echo "::error::_authToken present in ~/.npmrc; the OIDC exchange will be skipped"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
